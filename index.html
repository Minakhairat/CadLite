<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>CadLite</title>
<link rel="icon" href="./favicon.png"/>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#1e2127;color:#ddd;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;padding-top:max(8px,env(safe-area-inset-top));background:#2b2f38;align-items:center}
button,select,input{background:#3a4050;color:#eee;border:1px solid #555;border-radius:6px;padding:8px 10px;font-size:14px}
button.on{background:#2f6fed}.sep{width:1px;height:24px;background:#555}
#main{flex:1;display:flex;min-height:0}#main.mobile{flex-direction:column}
.pane{flex:1;position:relative;min-width:0;min-height:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
#sk{background:#fafafa}#status{position:absolute;left:8px;bottom:6px;font-size:12px;color:#666;pointer-events:none}
#v3{background:#20242c}
.f{display:flex;flex-direction:column;font-size:11px;color:#aab}.f input{width:84px;padding:5px 6px}
#tabs{display:none}#tog{display:none}
@media(max-width:800px){#tabs{display:flex;gap:6px;padding:6px 8px;background:#2b2f38}#tabs button{flex:1}#tog{display:inline-block}
#bar.collapsed .adv{display:none}.pane.hide{display:none}}
</style></head><body>
<div id="bar"><button id="tog">Tools ▾</button>
 <b>CadLite</b><span class="adv" style="display:contents"><span class="sep"></span>
 <button data-tool="rect" class="on">Rectangle</button><button data-tool="circle">Circle</button><button data-tool="poly">Polygon</button>
 <button id="clear">Clear sketch</button><span class="sep"></span>
 <label class="f">Depth (mm)<input id="depth" type="number" value="20"/></label>
 <button id="extrude">Extrude</button><button id="revolve">Revolve</button>
 <button id="undo">Undo feature</button> <span class="sep"></span>
 <label class="f">W / R (mm)<input id="d1" type="number" min="0" placeholder="width or radius"/></label>
 <label class="f">H (mm)<input id="d2" type="number" min="0" placeholder="height"/></label>
 <label class="f">X (mm)<input id="dx" type="number" value="0"/></label>
 <label class="f">Y (mm)<input id="dy" type="number" value="0"/></label>
 <button id="addnum">Add with exact size</button><span class="sep"></span>
 <button id="save">Save</button><button id="open">Open</button><input id="file" type="file" accept=".json" hidden/>
 <button id="stl">Export STL</button>
</span></div>
<div id="tabs"><button id="tabsk" class="on">Sketch</button><button id="tab3">3D model</button></div>
<div id="main"><div class="pane"><canvas id="sk"></canvas><div id="status">2D sketch (units: mm). Revolve axis = vertical axis, sketch on the right side.</div></div>
<div class="pane"><canvas id="v3"></canvas></div></div>
<script type="module" src="/src/main.ts"></script></body></html>
