<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>MK Cad</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg"/>
<style>
:root{--bg:#3b4251;--panel:#e9ecf1;--panel2:#dfe3ea;--line:#b9c0cc;--ink:#1d2330;--accent:#1f6fd1;--green:#2e8b57}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:12px/1.3 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:3px;cursor:pointer}
button:hover{background:#fff8;border-color:var(--line)}button.on{background:#cfe1fb;border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}
#title{height:30px;background:#2a303c;color:#e8ecf2;display:flex;align-items:center;gap:6px;padding:0 8px;padding-top:env(safe-area-inset-top)}
#title b{letter-spacing:.3px;margin-right:6px}#title button{color:#e8ecf2;padding:3px 8px}#title button:hover{background:#ffffff22;border-color:#ffffff33}
#title .doc{margin-left:auto;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs{height:26px;background:#d4d9e2;display:flex;align-items:flex-end;padding-left:6px;gap:2px;overflow-x:auto;white-space:nowrap}
#tabs button{height:24px;padding:0 14px;border-radius:3px 3px 0 0;border:1px solid var(--line);border-bottom:none;background:#c4cad6}
#tabs button.act{background:var(--panel);font-weight:600}
#tabs button.ctx{background:#cfeedd;border-color:#7ab898;color:#145a38}#tabs button.ctx.act{background:#e5f6ec}
#ribbon{height:92px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;overflow-y:hidden}
.tabpane{display:none;height:100%}.tabpane.show{display:flex}
.panel{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:3px 6px 0;min-width:70px}
.panel .btns{display:flex;gap:2px;flex:1;align-items:stretch}.panel .name{text-align:center;color:#556;font-size:11px;padding:2px 0;background:var(--panel2);margin:0 -6px;border-top:1px solid var(--line)}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;padding:2px 6px;gap:2px}
.big svg{width:32px;height:32px}.fields{display:grid;grid-template-columns:auto 80px auto 80px;gap:3px 6px;align-items:center;padding:2px 4px}
.fields input{width:100%;padding:2px 4px;border:1px solid var(--line);border-radius:2px;background:#fff}
.finish{color:var(--green);font-weight:600}
#body{flex:1;display:flex;min-height:0;position:relative}
#browser{width:230px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none;overflow:auto}
#browser h4{margin:0;padding:4px 8px;background:var(--panel2);border-bottom:1px solid var(--line);font-weight:600}
#tree{padding:4px 0;font-size:12px}.node{padding:2px 6px 2px calc(8px + var(--d)*14px);display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.node:hover{background:#d7e4f7}.node.sel{background:#b7d2f5}.node i{width:10px;height:10px;display:inline-block;border:1px solid #567;background:#fff}.node i.f{background:#8aa4c8}.node i.s{border-color:#2e8b57;background:#dff4e7}
#props{border-top:1px solid var(--line);padding:6px;display:none}#props.show{display:block}
#props .g{display:grid;grid-template-columns:1fr 1fr;gap:4px}#props label{display:flex;flex-direction:column;font-size:10px;color:#556}
#props input{width:100%;padding:2px 4px;border:1px solid var(--line);border-radius:2px;background:#fff}
.row{border:1px solid var(--line);background:#f7f8fb;border-radius:3px;padding:5px;margin-bottom:5px}.row button{border-color:var(--line);margin:4px 4px 0 0;padding:1px 6px}
#gfx{flex:1;position:relative;min-width:0;background:#cfd6e2}
canvas{position:absolute;inset:0 0 22px 0;width:100%;height:calc(100% - 22px);display:block;touch-action:none}
#sk{background:radial-gradient(ellipse at 50% 55%,#ffffff,#e6edf7)}#v3{background:radial-gradient(ellipse at 45% 60%,#f4f8fe 0%,#cfdcef 55%,#a9bddb 100%)}#doctabs{position:absolute;left:0;right:0;bottom:0;height:22px;background:#e3e8f0;border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:2px;padding-left:4px}#doctabs span{background:#fff;border:1px solid var(--line);border-bottom:0;padding:1px 14px;font-size:11px;border-radius:3px 3px 0 0;border-top:2px solid var(--accent)}
#nav{position:absolute;right:6px;top:100px;display:flex;flex-direction:column;gap:2px;background:#f4f6fad8;border:1px solid var(--line);border-radius:10px;padding:3px}#nav button{border-radius:8px;font-size:10px;padding:2px 3px}
#vc{position:absolute;right:8px;top:8px;display:grid;grid-template-columns:repeat(3,34px);gap:2px;background:#ffffffd0;border:1px solid var(--line);border-radius:4px;padding:3px}
#vc button,#nav button{background:#fff;border-color:var(--line);padding:3px 0;font-size:11px;min-height:24px}
#dlg{position:absolute;left:12px;top:12px;width:230px;background:var(--panel);border:1px solid #8a93a5;box-shadow:0 4px 14px #0004;border-radius:4px;display:none;z-index:5}
#dlg.show{display:block}#dlg h5{margin:0;padding:5px 8px;background:#cfd6e2;font-size:12px;border-bottom:1px solid var(--line)}
#dlg .in{padding:8px;display:grid;gap:6px}#dlg input{width:100%;padding:3px 5px;border:1px solid var(--line)}
#dlg .ok{display:flex;gap:6px;justify-content:flex-end;padding:6px 8px;border-top:1px solid var(--line)}#dlg .ok button{border-color:var(--line);background:#fff;padding:3px 14px}
#status{height:24px;background:#d4d9e2;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 8px;padding-bottom:env(safe-area-inset-bottom);white-space:nowrap;overflow:hidden}
#status .sp{margin-left:auto;color:#445}#bt{display:none}
#fin2{display:none;position:absolute;right:10px;bottom:34px;z-index:4;background:#2e8b57;color:#fff;border:0;padding:10px 16px;border-radius:20px;font-weight:600;box-shadow:0 2px 8px #0005}
@media(max-width:800px){#fin2.show{display:block}#title .doc{display:none}#title button{padding:3px 6px}#ribbon{height:100px}.big{min-width:50px;font-size:11px;padding:2px 3px}.fields{grid-template-columns:auto 62px auto 62px}.fields span{white-space:nowrap;font-size:12px}.panel{min-width:0}#p-sketch .panel:last-child{order:-1}#status{height:auto;min-height:24px;white-space:normal;flex-wrap:wrap;gap:2px 8px;padding-top:2px;padding-bottom:2px}#status .sp{display:none}#msg{flex:1;min-width:0}#browser{position:absolute;left:0;top:0;bottom:0;z-index:6;box-shadow:4px 0 14px #0004;transform:translateX(-102%);transition:transform .15s}#browser.open{transform:none}#bt{display:inline-block}#nav{top:80px}#nav button{font-size:9px}#ribbon{height:96px}}
</style></head><body>
<div id="title"><b>MK Cad</b><button id="save" title="Save to a .cadlite.json file">Save</button><button id="open">Open</button><button id="undo" title="Undo last feature">Undo feature</button><input id="file" type="file" accept=".json" hidden/><span class="doc" id="doc">Part1.cadlite.json (mm)</span></div>
<div id="tabs"><button class="act" data-tab="model">3D Model</button><button class="ctx" data-tab="sketch" id="tabsk" style="display:none">Sketch</button><button data-tab="view">View</button></div>
<div id="ribbon">
 <div class="tabpane show" id="p-model">
  <div class="panel"><div class="btns"><button class="big" id="startsk"><svg viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="18" fill="none" stroke="#2e8b57" stroke-width="2" stroke-dasharray="3 2"/><circle cx="16" cy="15" r="4" fill="none" stroke="#1f6fd1" stroke-width="2"/></svg>Start 2D Sketch</button></div><div class="name">Sketch</div></div>
  <div class="panel"><div class="btns"><button class="big" id="extrude"><svg viewBox="0 0 32 32"><path d="M6 22 L6 12 L16 6 L26 12 L26 22 L16 28 Z" fill="#8aa4c8" stroke="#34506f" stroke-width="1.5"/><path d="M6 12 L16 18 L26 12 M16 18 L16 28" fill="none" stroke="#34506f" stroke-width="1.5"/></svg>Extrude</button>
  <button class="big" id="revolve"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="9" rx="9" ry="3.5" fill="#cfe1fb" stroke="#34506f" stroke-width="1.5"/><path d="M7 9 L7 23 A9 3.5 0 0 0 25 23 L25 9" fill="#8aa4c8" stroke="#34506f" stroke-width="1.5"/></svg>Revolve</button></div><div class="name">Create</div></div>
  <div class="panel"><div class="btns"><button class="big" id="editft"><svg viewBox="0 0 32 32"><path d="M6 24 L6 20 L20 6 L26 12 L12 26 L8 26 Z" fill="#f0d98a" stroke="#6b5a1d" stroke-width="1.5"/></svg>Edit Feature</button><button class="big" id="delft"><svg viewBox="0 0 32 32"><path d="M8 8 L24 24 M24 8 L8 24" stroke="#b33" stroke-width="3"/></svg>Delete</button></div><div class="name">Modify</div></div>
  <div class="panel"><div class="btns"><button class="big" id="stl"><svg viewBox="0 0 32 32"><path d="M16 4 L16 20 M9 14 L16 21 L23 14 M6 26 L26 26" fill="none" stroke="#34506f" stroke-width="2.5"/></svg>Export STL</button></div><div class="name">Export</div></div>
 </div>
 <div class="tabpane" id="p-sketch">
  <div class="panel"><div class="btns"><button class="big" data-tool="rect"><svg viewBox="0 0 32 32"><rect x="5" y="8" width="22" height="16" fill="none" stroke="#1f6fd1" stroke-width="2.5"/></svg>Rectangle</button><button class="big" data-tool="circle"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="none" stroke="#1f6fd1" stroke-width="2.5"/></svg>Circle</button><button class="big" data-tool="poly"><svg viewBox="0 0 32 32"><path d="M6 24 L10 8 L24 6 L27 20 Z" fill="none" stroke="#1f6fd1" stroke-width="2.5"/></svg>Polygon</button></div><div class="name">Create</div></div>
  <div class="panel"><div class="btns" style="flex-direction:column;justify-content:center"><div class="fields"><span>W/R</span><input id="d1" type="number" min="0" placeholder="mm"/><span>H</span><input id="d2" type="number" min="0" placeholder="mm"/><span>X</span><input id="dx" type="number" value="0"/><span>Y</span><input id="dy" type="number" value="0"/></div><button id="addnum" style="border-color:#b9c0cc;background:#fff;margin:0 4px">Place with exact size (mm)</button></div><div class="name">Dimension</div></div>
  <div class="panel"><div class="btns"><button class="big" id="clear"><svg viewBox="0 0 32 32"><path d="M8 8 L24 24 M24 8 L8 24" stroke="#b33" stroke-width="3"/></svg>Clear sketch</button></div><div class="name">Modify</div></div>
  <div class="panel"><div class="btns"><button class="big finish" id="finish"><svg viewBox="0 0 32 32"><path d="M6 17 L13 24 L27 8" fill="none" stroke="#2e8b57" stroke-width="4"/></svg>Finish Sketch</button><button class="big" id="cancelsk"><svg viewBox="0 0 32 32"><path d="M8 8 L24 24 M24 8 L8 24" stroke="#777" stroke-width="3"/></svg>Cancel</button></div><div class="name">Exit</div></div>
 </div>
 <div class="tabpane" id="p-view">
  <div class="panel"><div class="btns"><button class="big" data-view="home">Home view</button><button class="big" data-view="all">Zoom All</button></div><div class="name">Navigate</div></div>
  <div class="panel"><div class="btns"><button class="big" data-view="top">Top</button><button class="big" data-view="front">Front</button><button class="big" data-view="right">Right</button></div><div class="name">Standard views</div></div>
 </div>
</div>
<div id="body">
 <div id="browser"><h4>Model</h4><div id="tree"></div><div id="props"></div></div>
 <div id="gfx"><canvas id="v3"></canvas><canvas id="sk" style="display:none"></canvas>
  <div id="vc"><button data-view="top">Top</button><button data-view="home">Home</button><button data-view="front">Front</button><button data-view="right">Right</button><button data-view="all">All</button><span></span></div>
  <div id="nav"><button data-view="all" title="Zoom All">Zoom All</button></div>
  <button id="fin2">&#10003; Finish Sketch</button>
  <div id="doctabs"><span>Part1</span></div>
  <div id="dlg"><h5 id="dlgt">Extrude</h5><div class="in"><label>Distance (mm)<input id="depth" type="number" value="20" min="0.01" step="any"/></label><div id="dlgmsg" style="color:#555"></div></div><div class="ok"><button id="dok">OK</button><button id="dcancel">Cancel</button></div></div>
 </div>
</div>
<div id="status"><button id="bt">Model browser</button><span id="msg">Ready</span><span class="sp" id="coord">mm</span></div>
<script type="module" src="/src/main.ts"></script></body></html>
