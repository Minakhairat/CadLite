# Manual only. Builds UNSIGNED desktop installers with Tauri. Runs on three OS runners,
# which may use billable Actions minutes on private repositories. Run deliberately.
name: Desktop builds
on: { workflow_dispatch: {} }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-22.04, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npm test
      - run: npm run icons
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with: { name: cadlite-${{ matrix.os }}, path: src-tauri/target/release/bundle/** }
